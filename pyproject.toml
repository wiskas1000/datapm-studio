[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapm-studio"
version = "0.1.0"
description = "Web UI for datapm — form-based metadata management for analytical projects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "data-project-manager",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.setuptools.packages.find]
include = ["datapm_studio*"]
