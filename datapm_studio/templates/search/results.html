{% extends "base.html" %}

{% block title %}Search — datapm studio{% endblock %}

{% block content %}
<h1>Search</h1>

<form action="{{ url_for('search.search') }}" method="get">
  <input type="search" name="q" value="{{ query }}" placeholder="Search projects...">
  <button type="submit">Search</button>
</form>

{% if query %}
  {% if results %}
  <ul>
    {% for result in results %}
    <li><a href="{{ url_for('projects.detail', slug=result.slug) }}">{{ result.title }}</a></li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No results for "{{ query }}".</p>
  {% endif %}
{% endif %}
{% endblock %}
