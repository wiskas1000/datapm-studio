{% if error %}
<div class="flash flash-error" style="margin-bottom: 0.75rem;">{{ error }}</div>
{% endif %}
<form hx-post="{{ url_for('persons.new_inline') }}" hx-target="#requestor-field" hx-swap="innerHTML">
  <p class="subtitle" style="margin-bottom: 0.75rem;">Add a new person</p>
  <div class="form-row">
    <input type="text" name="first_name" placeholder="First name" value="{{ first_name | default('') }}" required>
    <input type="text" name="last_name" placeholder="Last name" value="{{ last_name | default('') }}" required>
  </div>
  <div style="margin-top: 0.75rem;">
    <input type="email" name="email" placeholder="Email (optional)" value="{{ email | default('') }}">
  </div>
  <div style="margin-top: 0.75rem; display: flex; gap: 0.5rem;">
    <button type="submit" class="btn btn-primary">Add</button>
    <button type="button" class="btn btn-secondary" onclick="clearPerson()">Cancel</button>
  </div>
</form>
