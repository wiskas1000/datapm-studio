<div class="card" style="margin-bottom: 1.5rem;">
  <h2>Add person</h2>
  {% if error %}
  <div class="flash flash-error" style="margin-bottom: 0.75rem;">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('persons.new_page') }}">
    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" value="{{ first_name | default('') }}" required>
      </div>
      <div class="form-group">
        <label for="last_name">Last name</label>
        <input type="text" id="last_name" name="last_name" value="{{ last_name | default('') }}" required>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email | default('') }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="function_title">Function</label>
        <input type="text" id="function_title" name="function_title" value="{{ function_title | default('') }}">
      </div>
      <div class="form-group">
        <label for="department">Department</label>
        <input type="text" id="department" name="department" value="{{ department | default('') }}">
      </div>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button type="submit" class="btn btn-primary">Add person</button>
      <button type="button" class="btn btn-secondary"
              onclick="document.getElementById('person-form-area').innerHTML=''">Cancel</button>
    </div>
  </form>
</div>
