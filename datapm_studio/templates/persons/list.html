{% extends "base.html" %}

{% block title %}People — datapm studio{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-row">
    <h1>People</h1>
    <button class="btn btn-primary"
            hx-get="{{ url_for('persons.new_page') }}"
            hx-target="#person-form-area"
            hx-swap="innerHTML">+ Add person</button>
  </div>
</div>

<div class="card" style="margin-bottom: 1rem;">
  <input type="search" placeholder="Filter people..."
         hx-get="{{ url_for('persons.list_persons') }}"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#persons-table"
         hx-include="this"
         name="q"
         autocomplete="off">
</div>

<div id="person-form-area"></div>

<div id="persons-table">
  {% include "persons/_table.html" %}
</div>
{% endblock %}
