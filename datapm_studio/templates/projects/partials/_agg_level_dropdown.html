{# Dropdown results for aggregation level search. #}
{% if agg_levels %}
{% for agg in agg_levels %}
<button type="button" class="dropdown-item"
        hx-post="{{ url_for('projects.add_agg_level', slug=slug, file_id=file_id) }}"
        hx-vals='{"agg_level_id": "{{ agg.id }}"}'
        hx-target="#project-data-files"
        hx-swap="outerHTML">
  {{ agg.name }}
</button>
{% endfor %}
{% endif %}
{% if query and not exact_match %}
<button type="button" class="dropdown-item dropdown-item-create"
        hx-post="{{ url_for('projects.create_and_add_agg_level', slug=slug, file_id=file_id) }}"
        hx-vals='{"name": "{{ query }}"}'
        hx-target="#project-data-files"
        hx-swap="outerHTML">
  Create "{{ query }}"
</button>
{% endif %}
{% if not agg_levels and not query %}
<div class="dropdown-item" style="color: var(--text-muted);">Type to search…</div>
{% endif %}
